[Diplomacy]
; Allow Puppet Trade:
; 0 = Vanilla behavior (puppets can only trade with their master)
; 1 = Free trade (puppets can trade with any nation not at war)
; 2 = Free trade with Master Veto (puppets trade freely, but automatically respect master trade embargoes and master war enemies)
AllowPuppetTrade = 1

; Allow Expeditionary Forces to Players:
; 0 = Vanilla behavior (AI does not send expeditionary forces to human players, default)
; 1 = Modified behavior (expeditionary forces to players are allowed unless blacklisted with dont_want_exp_forces)
AllowExpForcesToPlayers = 1

[Map]
; Custom Straits System:
; 0 = Vanilla hardcoded straits
; 1 = Custom straits loaded from db\straits.csv
EnableCustomStraits = 1

[AI]
; Enable Allied Territory Garrison AI:
; 0 = Vanilla behavior (AI only garrisons owned/controlled provinces and repatriates from foreign soil)
; 1 = Allow garrisons in ally territory only
; 2 = Allow garrisons in ally and military access territory (default)
EnableAlliedGarrison = 1

; Multiplier applied to garrison requirement for areas with direct land connection to homeland (default = 0.333, 1.0 = do nothing / no division)
GarrisonLandConnectedMultiplier = 1

; Multiplier applied to garrison requirement during wartime (default = 0.5, 1.0 = do nothing / no halving)
GarrisonWartimeMultiplier = 0.5

[Engine]
; Binary Version Identifier (Global flag GAME_VERSION):
; Controls the numeric value assigned to the GAME_VERSION global flag on scenario/savegame load.
; Default = 1
GameVersion = 1
